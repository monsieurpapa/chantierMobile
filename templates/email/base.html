{% load i18n %}<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:480px;background-color:#ffffff;border-radius:6px;overflow:hidden;">
          <tr>
            <td style="background-color:#2c7be5;padding:16px 24px;">
              <span style="color:#ffffff;font-size:16px;font-weight:bold;">ChantierMobile</span>
            </td>
          </tr>
          <tr>
            <td style="padding:24px;">
              <h2 style="margin:0 0 16px;font-size:16px;color:#212529;">{% block email-header %}{% endblock %}</h2>
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px;border-top:1px solid #e9ecef;">
              <p style="margin:0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#999999;">
                {% trans "L'équipe ChantierMobile" %}
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
