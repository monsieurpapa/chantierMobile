{% extends 'falcon_base.html' %}
{% load static i18n %}
{% block content %}
<div class="container" data-layout="container">
  <div class="row flex-center min-vh-100 py-6">
    <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
      <a class="d-flex flex-center mb-4" href="{% url 'home' %}">
        <img src="{% static 'app/img/chantiermobile-logo.svg' %}" alt="ChantierMobile" width="200">
      </a>
      <div class="card">
        <div class="card-body p-4 p-sm-5 text-center">
          <div class="fs-5 text-600 mb-3"><span class="fas fa-sign-out-alt"></span></div>
          <h5>{% trans "Se déconnecter ?" %}</h5>
          <p class="fs--1 text-600">{% trans "Êtes-vous sûr de vouloir vous déconnecter ?" %}</p>
          <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            {{ redirect_field }}
            <button type="submit" class="btn btn-primary d-block w-100">{% trans "Se déconnecter" %}</button>
          </form>
          <a href="{% url 'home' %}" class="btn btn-link d-block w-100 mt-2">{% trans "Annuler" %}</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
