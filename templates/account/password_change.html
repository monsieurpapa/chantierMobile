{% extends 'falcon_base.html' %}
{% load static %}
{% block content %}
      <div class="container" data-layout="container">
        <script>
          var isFluid = JSON.parse(localStorage.getItem('isFluid'));
          if (isFluid) {
            var container = document.querySelector('[data-layout]');
            container.classList.remove('container');
            container.classList.add('container-fluid');
          }
        </script>
        <div class="row flex-center min-vh-100 py-6">
          <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
            <a class="d-flex flex-center mb-4" href="{% url 'home' %}">
              <img src="{% static 'app/img/chantiermobile-logo.svg' %}" alt="ChantierMobile" width="200">
            </a>
            <div class="card">
              <div class="card-body p-4 p-sm-5">
                <h5 class="text-center">Change your password 
                    <span><a href="{% url 'accounts:profile_update' %}">Cancel</a></span>
                </h5>                
                <form id="frmChangePassword" class="mt-3" method="POST" action="{% url 'account_change_password' %}">
                    {% csrf_token %}
                  <div class="mb-3">
                    <label class="form-label"></label>
                    {{ form.oldpassword }}{{ form.oldpassword.errors }}
                  </div>                    
                  <div class="mb-3">
                    <label class="form-label"></label>
                    {{ form.password1 }}{{ form.password1.errors }}
                  </div>            
                  <div class="mb-3">
                    <label class="form-label"></label>
                    {{ form.password2 }}{{ form.password2.errors }}
                  </div> 
                  <button class="btn btn-primary d-block w-100 mt-3" type="submit" name="submit">Change password</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>

{% endblock %}
