{% extends 'base.html' %}
{% load static %}

{% block subcontent %}
<div class="card mb-3">
    <div class="card-header">
        <h5 class="mb-0">Confirm Deletion</h5>
    </div>
    <div class="card-body bg-light">
        <p class="fs-0">
            Are you sure you want to delete "{{ object }}"?
        </p>
        <p class="text-danger border-start border-danger ps-2">
            <strong>Warning:</strong> This action cannot be undone. All related data will also be deleted.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-end gap-2">
                <a class="btn btn-falcon-default" href="{{ request.META.HTTP_REFERER|default:'/' }}">Cancel</a>
                <button class="btn btn-danger" type="submit">Confirm Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
