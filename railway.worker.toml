# Config for the Railway "worker" service (Celery worker + beat).
# Point the service at this file (Settings → Config-as-code path) so it
# doesn't inherit railway.toml's gunicorn start command and HTTP healthcheck.
[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "celery -A chantiermobile worker --beat --loglevel=info --concurrency=1"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
