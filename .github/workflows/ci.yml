name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-key-not-for-production
      # settings.py does `os.environ.get('DEBUG', 'False') == 'True'`, so this
      # must be the literal string "True" — "1" evaluates to DEBUG=False,
      # which flips ssl_require on and breaks the plain (non-SSL) postgres
      # service container used here.
      DEBUG: "True"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: chantiermobile.settings
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Install gettext (needed by compilemessages)
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Compile translations
        run: python manage.py compilemessages

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: python -m pytest tests/ -x --no-cov -q
