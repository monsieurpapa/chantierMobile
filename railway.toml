[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "python manage.py migrate && python manage.py collectstatic --no-input && gunicorn chantiermobile.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
