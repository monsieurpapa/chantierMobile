{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h1 class="mb-6">New Expense</h1>

    <div class="card">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                <small style="color: var(--text-secondary);">{{ field.help_text }}</small>
                {% endif %}
                {% if field.errors %}
                <div style="color: var(--danger-color); font-size: 0.875rem;">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}

            <div class="flex justify-between items-center" style="margin-top: 2rem;">
                <a href="{% url 'expense_list' %}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">Submit Request</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
