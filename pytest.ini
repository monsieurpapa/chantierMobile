[tool:pytest]
DJANGO_SETTINGS_MODULE = chantiermobile.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --reuse-db
    --nomigrations
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
testpaths = tests
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
    auth: Authentication related tests
    finance: Finance module tests
    materials: Materials module tests
    personnel: Personnel module tests
    projects: Projects module tests
    revenue: Revenue module tests
    i18n: Internationalization tests
    api: API tests
