services:
  - type: web
    name: chantiermobile
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn chantiermobile.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: chantiermobile.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      # ALLOWED_HOSTS: update to your actual .onrender.com subdomain after first deploy.
      # Render also sets RENDER_EXTERNAL_HOSTNAME automatically — settings.py reads it.
      - key: ALLOWED_HOSTS
        value: "chantiermobile.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
      # DATABASE_URL: paste your Supabase connection string (recommended — no 90-day expiry).
      # Format: postgresql://user:password@host:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
      # REDIS_URL: paste your Upstash Redis TLS URL.
      # Format: rediss://default:password@host:port
      - key: REDIS_URL
        sync: false
      # Media files (Cloudflare R2 — S3-compatible, 10 GB free)
      - key: CLOUDFARE_R2_TOKEN_NAME
        sync: false
      - key: CLOUDFARE_API_TOKEN
        sync: false
      - key: CLOUDFARE_R2_BUCKET_NAME
        sync: false
      - key: CLOUDFARE_R2_BUCKET_URL
        sync: false
      # Optional: email (Gmail SMTP or any SMTP provider)
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "noreply@chantiermobile.com"

  - type: worker
    name: chantiermobile-celery
    runtime: python
    buildCommand: "./build.sh"
    # --beat runs the scheduler inside the worker (saves one service slot on free tier)
    startCommand: "celery -A chantiermobile worker --beat --loglevel=info --concurrency=1"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: chantiermobile.settings
      - key: DEBUG
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        fromService:
          name: chantiermobile
          type: web
          property: envVarValue
          envVarKey: SECRET_KEY
